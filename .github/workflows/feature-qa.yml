name: Mobile Harness feature QA

on:
  push:
    branches:
      - feature/reliable-runtime-diff-skills

jobs:
  unit-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and compile
        run: ./gradlew testOnlineDebugUnitTest assembleOnlineDebug --no-daemon
