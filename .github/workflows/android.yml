name: Android QA

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[publish-existing]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configure permanent Codeair release signing key
        shell: bash
        env:
          MH_RELEASE_KEYSTORE_BASE64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          MH_RELEASE_STORE_PASSWORD: ${{ secrets.MH_RELEASE_STORE_PASSWORD }}
          MH_RELEASE_KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          MH_RELEASE_KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MH_RELEASE_KEYSTORE_BASE64}" || -z "${MH_RELEASE_STORE_PASSWORD}" || -z "${MH_RELEASE_KEY_ALIAS}" || -z "${MH_RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Permanent release signing secrets are required. No temporary signing key will be generated."
            exit 1
          fi
          printf '%s' "${MH_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/mobile-harness-release.jks"
          chmod 600 "$RUNNER_TEMP/mobile-harness-release.jks"
          echo "Using the permanent Codeair Software Solutions release signing key."
          echo "MH_UPLOAD_STORE_FILE=$RUNNER_TEMP/mobile-harness-release.jks" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_STORE_PASSWORD=${MH_RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_KEY_ALIAS=${MH_RELEASE_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_KEY_PASSWORD=${MH_RELEASE_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Verify permanent release signing certificate
        shell: bash
        env:
          MH_RELEASE_STORE_PASSWORD: ${{ secrets.MH_RELEASE_STORE_PASSWORD }}
          MH_RELEASE_KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="86:D4:21:7F:86:E4:0A:B2:58:46:04:C5:6D:C3:6A:FB:54:DF:83:5D:38:2A:A4:FC:65:07:40:C6:00:1D:E0:F5"
          ACTUAL_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/mobile-harness-release.jks" -storepass "$MH_RELEASE_STORE_PASSWORD" -alias "$MH_RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          echo "Release signing SHA-256: $ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The configured release keystore is not the permanent Codeair signing key."
            exit 1
          fi
      - name: Fetch latest verified runtime bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/runtime-bundles
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo = "techjarves/Mobile-Harness"
          token = os.environ["GITHUB_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              releases = json.load(response)

          prefixes = {
              "core": "pocketdev-core-arm64-",
              "claude": "pocketdev-claude-arm64-",
              "python": "pocketdev-python-arm64-",
              "android": "pocketdev-android-arm64-",
              "dsh": "pocketdev-dsh-arm64-",
              "agy": "pocketdev-agy-arm64-",
          }

          def version_key(value):
              return tuple(int(x) for x in re.findall(r"\d+", value)) or (0,)

          selected = {}
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              tag = release.get("tag_name", "")
              if not tag.startswith("runtime-"):
                  continue
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  for component, prefix in prefixes.items():
                      if name.startswith(prefix) and name.endswith(".tar.zst"):
                          version = name[len(prefix):-len(".tar.zst")]
                          if version and re.fullmatch(r"[0-9A-Za-z._+-]+", version):
                              candidate = (version_key(version), version, asset)
                              current = selected.get(component)
                              if current is None or candidate[:2] > current[:2]:
                                  selected[component] = candidate

          missing = sorted(set(prefixes) - set(selected))
          if missing:
              raise SystemExit(f"Missing published runtime bundles: {', '.join(missing)}")

          manifest = {}
          for component, (_, version, asset) in selected.items():
              name = asset["name"]
              out = os.path.join("dist/runtime-bundles", name)
              download = urllib.request.Request(
                  asset["url"],
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/octet-stream",
                  },
              )
              with urllib.request.urlopen(download, timeout=300) as response, open(out, "wb") as target:
                  target.write(response.read())
              digest = asset.get("digest", "").removeprefix("sha256:")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", digest):
                  raise SystemExit(f"Missing SHA-256 digest for {name}")
              import hashlib
              actual = hashlib.sha256(open(out, "rb").read()).hexdigest()
              if actual.lower() != digest.lower():
                  raise SystemExit(f"SHA-256 mismatch for {name}: {actual} != {digest}")
              manifest[component] = {
                  "version": version,
                  "file": name,
                  "sha256": digest.lower(),
                  "sizeBytes": os.path.getsize(out),
              }

          with open("dist/runtime-bundles/manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          du -h dist/runtime-bundles/*.tar.zst | sort -h

      - name: Verify online build and unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testOnlineDebugUnitTest assembleOnlineDebug 2>&1 | tee "$RUNNER_TEMP/online-build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "===== ONLINE BUILD FAILURE ====="
            tail -n 250 "$RUNNER_TEMP/online-build.log"
            exit "$rc"
          fi

      - name: Verify offline build
        run: ./gradlew --no-daemon --stacktrace assembleOfflineDebug

      - name: Compile online release APK
        run: ./gradlew --no-daemon --stacktrace assembleOnlineRelease

      - name: Compile offline release APK
        run: ./gradlew --no-daemon --stacktrace assembleOfflineRelease

      - name: Verify release APK signatures and alignment
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs found"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Verify in-place update compatibility against previous release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          PREVIOUS="$RUNNER_TEMP/mobile-harness-previous.apk"
          gh release download v1.0.19 -p "app-online-release.apk" -O "$PREVIOUS" -R "$GITHUB_REPOSITORY"
          current_cert="$($APKSIGNER verify --print-certs app/build/outputs/apk/online/release/app-online-release.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          previous_cert="$($APKSIGNER verify --print-certs "$PREVIOUS" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          echo "Previous release certificate: $previous_cert"
          echo "Current release certificate:  $current_cert"
          test -n "$current_cert"
          test "$current_cert" = "$previous_cert"

          current_badging="$($AAPT2 dump badging app/build/outputs/apk/online/release/app-online-release.apk)"
          previous_badging="$($AAPT2 dump badging "$PREVIOUS")"
          echo "$previous_badging" | grep -q "versionCode='20'"
          echo "$previous_badging" | grep -q "versionName='1.0.19'"
          VERSION_NAME=$(awk -F'"' '/versionName = "/ {print $2; exit}' app/build.gradle.kts)
          VERSION_CODE=$(awk -F'= ' '/versionCode = / {print $2; exit}' app/build.gradle.kts)
          echo "$current_badging" | grep -q "versionCode='$VERSION_CODE'"
          echo "$current_badging" | grep -q "versionName='$VERSION_NAME'"
          echo "$current_badging" | grep -q "package: name='com.jarves.mh'"
          echo "$previous_badging" | grep -q "package: name='com.jarves.mh'"
          echo "PASS: same package + same signing certificate + strictly increasing versionCode."

      - name: Inspect release APKs
        shell: bash
        run: |
          set -euxo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\\n' | sort

      - name: Prepare emulator verification script
        shell: bash
        run: |
          cat << 'EOF' > run-emulator-verification.sh
          set -euxo pipefail
          PREVIOUS_APK="/tmp/mobile-harness-previous.apk"
          if [ -f "$RUNNER_TEMP/mobile-harness-previous.apk" ]; then
            cp "$RUNNER_TEMP/mobile-harness-previous.apk" "$PREVIOUS_APK"
          else
            gh release download v1.0.19 -p "app-online-release.apk" -O "$PREVIOUS_APK" -R "$GITHUB_REPOSITORY"
          fi
          echo "Previous release:"
          "$ANDROID_HOME/platform-tools/adb" install "$PREVIOUS_APK"
          "$ANDROID_HOME/platform-tools/adb" shell dumpsys package com.jarves.mh | grep -E 'versionCode=|versionName=' || true
          echo "Current release update:"
          "$ANDROID_HOME/platform-tools/adb" install -r app/build/outputs/apk/online/release/app-online-release.apk
          "$ANDROID_HOME/platform-tools/adb" shell dumpsys package com.jarves.mh | grep -E 'versionCode=|versionName=' || true
          echo "PASS: previous release installed and current release updated in place."
          EOF
          chmod +x run-emulator-verification.sh

      - name: Verify in-place update on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash ./run-emulator-verification.sh
      
      - name: Upload emulator launch logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-launch-logs
          if-no-files-found: warn
          path: emulator-logs/
      - name: Upload release APKs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-release-apks
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk

      # Every successful main-branch build publishes the freshly verified online/offline APKs to the current release.
      # Header layout release 1.0.12.
      # Release publication marker for the verified build.
      - name: Publish release assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_NAME=$(awk -F'"' '/versionName = "/ {print $2; exit}' app/build.gradle.kts)
          VERSION_CODE=$(awk -F'= ' '/versionCode = / {print $2; exit}' app/build.gradle.kts)
          TAG="v$VERSION_NAME"
          ONLINE="app-online-release.apk"
          OFFLINE="app-offline-release.apk"
          cp app/build/outputs/apk/online/release/app-online-release.apk "$ONLINE"
          cp app/build/outputs/apk/offline/release/app-offline-release.apk "$OFFLINE"
          ONLINE_SHA=$(sha256sum "$ONLINE" | awk '{print $1}')
          OFFLINE_SHA=$(sha256sum "$OFFLINE" | awk '{print $1}')
          ONLINE_SIZE=$(stat -c '%s' "$ONLINE")
          OFFLINE_SIZE=$(stat -c '%s' "$OFFLINE")
          export TAG VERSION_NAME VERSION_CODE ONLINE_SHA OFFLINE_SHA ONLINE_SIZE OFFLINE_SIZE
          cat > release-notes.md <<EOF
          ## Mobile Harness $TAG

          ### Changes in this build
          - Fixed Antigravity CLI detection when the guest executable is exposed through absolute or relative symlinks inside the Ubuntu PRoot rootfs.
          - Unified guest-aware executable detection for Antigravity, Claude / Cloud Code, and DeepSeek.
          - Fixed stale agent installation state so Settings reflects the actual installed agent inventory.
          - Added live installed-agent refresh when opening Agent and Settings screens and after changing the active agent.
          - Agent installation and update controls remain exclusively on the Agents screen; Settings remains focused on environment updates.
          - Added skill update checking and per-skill update actions, including GitHub main/master fallback and safe extraction.
          - Fixed Skills screen compile issues for the new update controls.
          - Kept offline runtime setup network-free; missing non-bundled toolchains now fail clearly instead of silently downloading.
          - Added live environment version refresh for Claude Code, DeepSeek Harness, and Antigravity CLI from their real upstream sources.
          - Environment Update actions are enabled only for components with a supported live updater or verified HTTPS package; metadata-only core/Python/Android entries no longer trigger a fake package update.
          - Added real install/update routing for Python and Android toolchains through the latest verified upstream runtime bundles; CI now resolves the newest non-prerelease runtime asset for every bundled toolchain instead of pinning stale asset IDs.
          - Removed misleading disabled actions for components that do not have a standalone package; bundled Core remains runtime-managed while Python/Android expose real Install/Update actions, and PHP/C++ update paths are explicit about online package requirements.
          - Added persistent operation-failure logging for environment updates so caught runtime update exceptions are captured in crash.log.
          - Updated PHP to the PHP 8.4 package path with Composer refresh support, dynamically resolved the latest verified runtime bundles, and verified online/offline builds, unit tests, permanent release signing, APK alignment, and release integrity in CI.

          ### Release files
          - **Online Release:** app-online-release.apk
          - **Offline Release:** app-offline-release.apk

          The release contains the two APKs plus the `mobile-harness-update.json` manifest. Debug APKs are CI-only artifacts and are not release downloads.
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Mobile Harness $TAG" --notes-file release-notes.md
          gh release edit "$TAG" --title "Mobile Harness $TAG" --notes-file release-notes.md
          python3 - <<'PY'
          import json, os
          with open("dist/runtime-bundles/manifest.json") as handle:
              bundles = json.load(handle)
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          tag = os.environ["TAG"]

          def component(cid, label, key, notes):
              item = bundles[key]
              return {
                  "id": cid,
                  "label": label,
                  "version": item["version"],
                  "packageUrl": "",
                  "sha256": item["sha256"],
                  "sizeBytes": item["sizeBytes"],
                  "status": "stable",
                  "minRuntimeGeneration": 1,
                  "activeLink": "",
                  "healthCommand": "",
                  "notes": notes,
              }

          manifest = {
              "schemaVersion": 2,
              "versionCode": version_code,
              "versionName": version_name,
              "channel": "stable",
              "notes": (
                  f"Mobile Harness {tag} — verified latest runtime assets and toolchain update controls. "
                  "Runtime bundles are resolved from the latest non-prerelease upstream runtime release and SHA-256 verified during CI. "
                  "PHP uses the online Ubuntu package path with the PHP 8.4 package source and latest Composer release."
              ),
              "artifacts": {
                  "online": {
                      "url": f"https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/{tag}/app-online-release.apk",
                      "sha256": os.environ["ONLINE_SHA"],
                      "sizeBytes": int(os.environ["ONLINE_SIZE"]),
                  },
                  "offline": {
                      "url": f"https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/{tag}/app-offline-release.apk",
                      "sha256": os.environ["OFFLINE_SHA"],
                      "sizeBytes": int(os.environ["OFFLINE_SIZE"]),
                  },
              },
              "components": [
                  component("core", "Core tools", "core", "Latest verified ARM64 core runtime bundle."),
                  component("python", "Python", "python", "Latest verified ARM64 Python runtime bundle."),
                  component("android", "Android SDK / Build Tools / Gradle", "android", "Latest verified ARM64 Android runtime bundle."),
                  component("claude", "Claude Code", "claude", "Latest verified ARM64 Claude Code bundle."),
                  component("deepseek", "DeepSeek Harness", "dsh", "Latest verified ARM64 DeepSeek Harness bundle."),
                  component("antigravity", "Antigravity CLI", "agy", "Latest verified ARM64 Antigravity CLI bundle."),
                  {
                      "id": "php",
                      "label": "PHP",
                      "version": "8.4",
                      "packageUrl": "",
                      "sha256": "",
                      "sizeBytes": 0,
                      "status": "online-only",
                      "minRuntimeGeneration": 1,
                      "activeLink": "",
                      "healthCommand": "php --version && composer --version",
                      "notes": "PHP 8.4 package source via Ondřej PHP PPA for the Ubuntu 20.04 ARM64 runtime; Composer uses the official latest-stable release.",
                  },
              ],
          }
          with open("mobile-harness-update.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          PY

          gh release upload "$TAG" "$ONLINE" "$OFFLINE" mobile-harness-update.json --clobber
          gh release delete-asset "$TAG" "mobile-harness-online-$TAG.apk" --yes || true
          gh release delete-asset "$TAG" "mobile-harness-offline-$TAG.apk" --yes || true

  publish_existing_v1_0_6:
    if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-existing]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified release artifact from Run #78
        uses: actions/download-artifact@v4
        with:
          name: mobile-harness-release-apks
          repository: ${{ github.repository }}
          run-id: 36969873091
          github-token: ${{ github.token }}
          path: release-artifact
          merge-multiple: true

      - name: Prepare v1.0.6 release assets
        shell: bash
        run: |
          set -euxo pipefail
          ONLINE_SRC=$(find release-artifact -type f -name 'app-online-release.apk' | head -n 1)
          OFFLINE_SRC=$(find release-artifact -type f -name 'app-offline-release.apk' | head -n 1)
          test -n "$ONLINE_SRC"
          test -n "$OFFLINE_SRC"
          cp "$ONLINE_SRC" app-online-release.apk
          cp "$OFFLINE_SRC" app-offline-release.apk
          ONLINE_SHA=$(sha256sum app-online-release.apk | awk '{print $1}')
          OFFLINE_SHA=$(sha256sum app-offline-release.apk | awk '{print $1}')
          ONLINE_SIZE=$(stat -c '%s' app-online-release.apk)
          OFFLINE_SIZE=$(stat -c '%s' app-offline-release.apk)
          cat > mobile-harness-update.json <<EOF
          {
            "versionCode": 7,
            "versionName": "1.0.6",
            "notes": "Production release with startup crash logging and verified runtime packaging.",
            "artifacts": {
              "online": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/v1.0.6/app-online-release.apk",
                "sha256": "$ONLINE_SHA",
                "sizeBytes": $ONLINE_SIZE
              },
              "offline": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/v1.0.6/app-offline-release.apk",
                "sha256": "$OFFLINE_SHA",
                "sizeBytes": $OFFLINE_SIZE
              }
            }
          }
          EOF

      - name: Publish canonical v1.0.6 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release upload v1.0.6 app-online-release.apk app-offline-release.apk mobile-harness-update.json --clobber

# publish-current-release
