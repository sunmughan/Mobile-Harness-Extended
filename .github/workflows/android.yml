name: Android QA

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[publish-existing]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configure permanent Codeair release signing key
        shell: bash
        env:
          MH_RELEASE_KEYSTORE_BASE64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          MH_RELEASE_STORE_PASSWORD: ${{ secrets.MH_RELEASE_STORE_PASSWORD }}
          MH_RELEASE_KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          MH_RELEASE_KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MH_RELEASE_KEYSTORE_BASE64}" || -z "${MH_RELEASE_STORE_PASSWORD}" || -z "${MH_RELEASE_KEY_ALIAS}" || -z "${MH_RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Permanent release signing secrets are required. No temporary signing key will be generated."
            exit 1
          fi
          printf '%s' "${MH_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/mobile-harness-release.jks"
          chmod 600 "$RUNNER_TEMP/mobile-harness-release.jks"
          echo "Using the permanent Codeair Software Solutions release signing key."
          echo "MH_UPLOAD_STORE_FILE=$RUNNER_TEMP/mobile-harness-release.jks" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_STORE_PASSWORD=${MH_RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_KEY_ALIAS=${MH_RELEASE_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "MH_UPLOAD_KEY_PASSWORD=${MH_RELEASE_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Verify permanent release signing certificate
        shell: bash
        env:
          MH_RELEASE_STORE_PASSWORD: ${{ secrets.MH_RELEASE_STORE_PASSWORD }}
          MH_RELEASE_KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="86:D4:21:7F:86:E4:0A:B2:58:46:04:C5:6D:C3:6A:FB:54:DF:83:5D:38:2A:A4:FC:65:07:40:C6:00:1D:E0:F5"
          ACTUAL_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/mobile-harness-release.jks" -storepass "$MH_RELEASE_STORE_PASSWORD" -alias "$MH_RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          echo "Release signing SHA-256: $ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The configured release keystore is not the permanent Codeair signing key."
            exit 1
          fi
      - name: Fetch pinned runtime bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/runtime-bundles
          declare -A ASSET_ID=(
            [pocketdev-core-arm64-2026.09.5.tar.zst]=550313841
            [pocketdev-claude-arm64-2026.09.1.tar.zst]=550313839
            [pocketdev-python-arm64-2026.09.2.tar.zst]=546547662
            [pocketdev-android-arm64-2026.09.1.tar.zst]=546548315
            [pocketdev-dsh-arm64-2026.09.1.tar.zst]=547047395
            [pocketdev-agy-arm64-2026.09.1.tar.zst]=549967980
          )
          declare -A SHA256=(
            [pocketdev-core-arm64-2026.09.5.tar.zst]=df0cf7251c74f82d424231e3804114a4ca66b16130eea9abab11e220dc7ac012
            [pocketdev-claude-arm64-2026.09.1.tar.zst]=0f68e15630e8c0fc941afe3f61ab5a3eb4407b334018de6dbdabfa5eca627724
            [pocketdev-python-arm64-2026.09.2.tar.zst]=6b3f56f7743fec142bc045db3ea561ee83fe89af87c2799165ef60351164ef85
            [pocketdev-android-arm64-2026.09.1.tar.zst]=01bea058ebcb17416d1eb08c0211b3782da3228eb3c8348eb3719f2d61dd3ec6
            [pocketdev-dsh-arm64-2026.09.1.tar.zst]=88e6a23ba74e1cd74a2c923b7e0d6bd78ba4b7e5f8a9b649f12bf4ffe158cce5
            [pocketdev-agy-arm64-2026.09.1.tar.zst]=a659ab9188956fc4721ca86fb21b5118e0e489f47a5e02ae6b4f2fb423659d78
          )
          for file in "${!ASSET_ID[@]}"; do
            curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -o "dist/runtime-bundles/$file" \
              "https://api.github.com/repos/techjarves/Mobile-Harness/releases/assets/${ASSET_ID[$file]}"
            printf '%s  %s\n' "${SHA256[$file]}" "dist/runtime-bundles/$file" | sha256sum -c -
          done
          du -h dist/runtime-bundles/*.tar.zst | sort -h

      - name: Verify online build and unit tests
        run: ./gradlew --no-daemon --stacktrace testOnlineDebugUnitTest assembleOnlineDebug

      - name: Verify offline build
        run: ./gradlew --no-daemon --stacktrace assembleOfflineDebug

      - name: Compile online release APK
        run: ./gradlew --no-daemon --stacktrace assembleOnlineRelease

      - name: Compile offline release APK
        run: ./gradlew --no-daemon --stacktrace assembleOfflineRelease

      - name: Verify release APK signatures and alignment
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs found"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Inspect release APKs
        shell: bash
        run: |
          set -euxo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\\n' | sort

      - name: Upload emulator launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-launch-logs
          if-no-files-found: warn
          path: emulator-logs/
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-release-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk

      # Publishes the freshly verified online/offline APKs to the current release. [publish-release]
      # Header layout release 1.0.12.
      # Release publication marker for the verified build.
      - name: Publish release assets
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_NAME=$(awk -F'"' '/versionName = "/ {print $2; exit}' app/build.gradle.kts)
          VERSION_CODE=$(awk -F'= ' '/versionCode = / {print $2; exit}' app/build.gradle.kts)
          TAG="v$VERSION_NAME"
          ONLINE="app-online-release.apk"
          OFFLINE="app-offline-release.apk"
          cp app/build/outputs/apk/online/release/app-online-release.apk "$ONLINE"
          cp app/build/outputs/apk/offline/release/app-offline-release.apk "$OFFLINE"
          ONLINE_SHA=$(sha256sum "$ONLINE" | awk '{print $1}')
          OFFLINE_SHA=$(sha256sum "$OFFLINE" | awk '{print $1}')
          ONLINE_SIZE=$(stat -c '%s' "$ONLINE")
          OFFLINE_SIZE=$(stat -c '%s' "$OFFLINE")
          cat > release-notes.md <<EOF
          ## Mobile Harness $TAG

          ### Changes in this build
          - Fixed Antigravity CLI detection when the guest executable is exposed through absolute or relative symlinks inside the Ubuntu PRoot rootfs.
          - Unified guest-aware executable detection for Antigravity, Claude / Cloud Code, and DeepSeek.
          - Fixed stale agent installation state so Settings reflects the actual installed agent inventory.
          - Added live installed-agent refresh when opening Agent and Settings screens and after changing the active agent.
          - Agent installation and update controls remain exclusively on the Agents screen; Settings remains focused on environment updates.
          - Added skill update checking and per-skill update actions, including GitHub main/master fallback and safe extraction.
          - Fixed Skills screen compile issues for the new update controls.
          - Kept offline runtime setup network-free; missing non-bundled toolchains now fail clearly instead of silently downloading.
          - Added live environment version refresh for Claude Code, DeepSeek Harness, and Antigravity CLI from their real upstream sources.
          - Environment Update actions are enabled only for components with a supported live updater or verified HTTPS package; metadata-only core/Python/Android entries no longer trigger a fake package update.
          - Added real install/update routing for Python and Android toolchains through the verified upstream runtime bundles; their versions are discovered from published runtime assets instead of hard-coded package URLs.
          - Removed misleading disabled actions for components that do not have a standalone package; bundled Core remains runtime-managed while Python/Android expose real Install/Update actions.
          - Added persistent operation-failure logging for environment updates so caught runtime update exceptions are captured in crash.log.
          - Verified online/offline builds, unit tests, permanent release signing, APK alignment, and release integrity in CI.

          ### Release files
          - **Online Release:** app-online-release.apk
          - **Offline Release:** app-offline-release.apk

          The release contains the two APKs plus the `mobile-harness-update.json` manifest. Debug APKs are CI-only artifacts and are not release downloads.
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Mobile Harness $TAG" --notes-file release-notes.md
          gh release edit "$TAG" --title "Mobile Harness $TAG" --notes-file release-notes.md
          cat > mobile-harness-update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "notes": "Mobile Harness v1.0.13 — Agent detection and environment-state fixes.\n\nChanges:\n- Fixed Antigravity CLI installation detection when its guest executable is exposed through an absolute or relative symlink inside the Ubuntu PRoot rootfs.\n- Unified guest-aware executable detection for Antigravity, Claude/Cloud Code, and DeepSeek.\n- Fixed stale agent installation state so Settings reflects the actual installed agent inventory.\n- Added live installed-agent refresh when opening Agent and Settings screens and after changing the active agent.\n- Kept agent installation/update controls exclusively on the Agents screen; Settings remains focused on environment updates.\n- Added skill update checking and per-skill update actions, with GitHub main/master fallback and safe extraction.\n- Fixed Skills screen compile issues for the update controls.\n- Kept offline runtime setup network-free; missing non-bundled toolchains now fail clearly instead of silently downloading.\n- Verified online and offline builds, release signing, APK alignment, and release APK integrity in CI.\n\nRelease assets:\n- Online Release APK — app-online-release.apk\n- Offline Release APK — app-offline-release.apk\n\nOnly the two release APKs are published as release downloads; debug APKs remain CI artifacts only.",
            "artifacts": {
              "online": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/$TAG/app-online-release.apk",
                "sha256": "$ONLINE_SHA",
                "sizeBytes": $ONLINE_SIZE
              },
              "offline": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/$TAG/app-offline-release.apk",
                "sha256": "$OFFLINE_SHA",
                "sizeBytes": $OFFLINE_SIZE
              }
            }
          }
          EOF
          cat > mobile-harness-update.json <<EOF
          {
            "schemaVersion": 2,
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "channel": "stable",
            "notes": "Mobile Harness $TAG — Live environment version detection and update controls.\n\nClaude Code, DeepSeek Harness, and Antigravity CLI are checked against their real upstream versions and use their supported live update paths. Python and Android are installed/updated from verified runtime release assets discovered from the upstream runtime release feed. Core remains runtime-managed because it is the base filesystem, so the UI does not expose a fake standalone package update. All downloadable runtime assets are checksum-verified.",
            "artifacts": {
              "online": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/$TAG/app-online-release.apk",
                "sha256": "$ONLINE_SHA",
                "sizeBytes": $ONLINE_SIZE
              },
              "offline": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/$TAG/app-offline-release.apk",
                "sha256": "$OFFLINE_SHA",
                "sizeBytes": $OFFLINE_SIZE
              }
            },
            "components": [
              {"id":"core","label":"Core tools","version":"2026.09.5","packageUrl":"","sha256":"df0cf7251c74f82d424231e3804114a4ca66b16130eea9abab11e220dc7ac012","sizeBytes":72185773,"status":"stable","minRuntimeGeneration":1,"activeLink":"","healthCommand":"","notes":"Node.js 24.19.0, npm 11.17.0 and Git 2.25.1 are bundled in the verified core runtime."},
              {"id":"python","label":"Python","version":"2026.09.2","packageUrl":"","sha256":"6b3f56f7743fec142bc045db3ea561ee83fe89af87c2799165ef60351164ef85","sizeBytes":55419626,"status":"stable","minRuntimeGeneration":1,"activeLink":"","healthCommand":"python3 --version","notes":"Verified ARM64 Python bundle metadata. A standalone update package is not published yet."},
              {"id":"android","label":"Android SDK / Build Tools / Gradle","version":"2026.09.1","packageUrl":"","sha256":"01bea058ebcb17416d1eb08c0211b3782da3228eb3c8348eb3719f2d61dd3ec6","sizeBytes":569652007,"status":"stable","minRuntimeGeneration":1,"activeLink":"","healthCommand":"java -version && gradle --version","notes":"Temurin 17, Android SDK 36, Build Tools 35.0.0 and Gradle 8.14.3 bundle metadata."},
              {"id":"claude","label":"Claude Code","version":"2.1.263","packageUrl":"","sha256":"0f68e15630e8c0fc941afe3f61ab5a3eb4407b334018de6dbdabfa5eca627724","sizeBytes":75289800,"status":"stable","minRuntimeGeneration":1,"activeLink":"","healthCommand":"claude --version","notes":"Bundled ARM64 Claude Code version."},
              {"id":"deepseek","label":"DeepSeek Harness","version":"0.1.2-rc.1","packageUrl":"","sha256":"88e6a23ba74e1cd74a2c923b7e0d6bd78ba4b7e5f8a9b649f12bf4ffe158cce5","sizeBytes":27752194,"status":"stable","minRuntimeGeneration":1,"activeLink":"","healthCommand":"dsh --version","notes":"Bundled ARM64 DeepSeek Harness version."},
              {"id":"antigravity","label":"Antigravity CLI","version":"1.1.27","packageUrl":"","sha256":"a659ab9188956fc4721ca86fb21b5118e0e489f47a5e02ae6b4f2fb423659d78","sizeBytes":41870025,"status":"stable","minRuntimeGeneration":1,"activeLink":"","healthCommand":"agy --version","notes":"Bundled ARM64 Antigravity CLI version."}
            ]
          }
          EOF
          gh release upload "$TAG" "$ONLINE" "$OFFLINE" mobile-harness-update.json --clobber
          gh release delete-asset "$TAG" "mobile-harness-online-$TAG.apk" --yes || true
          gh release delete-asset "$TAG" "mobile-harness-offline-$TAG.apk" --yes || true

  publish_existing_v1_0_6:
    if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-existing]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified release artifact from Run #78
        uses: actions/download-artifact@v4
        with:
          name: mobile-harness-release-apks
          repository: ${{ github.repository }}
          run-id: 36969873091
          github-token: ${{ github.token }}
          path: release-artifact
          merge-multiple: true

      - name: Prepare v1.0.6 release assets
        shell: bash
        run: |
          set -euxo pipefail
          ONLINE_SRC=$(find release-artifact -type f -name 'app-online-release.apk' | head -n 1)
          OFFLINE_SRC=$(find release-artifact -type f -name 'app-offline-release.apk' | head -n 1)
          test -n "$ONLINE_SRC"
          test -n "$OFFLINE_SRC"
          cp "$ONLINE_SRC" app-online-release.apk
          cp "$OFFLINE_SRC" app-offline-release.apk
          ONLINE_SHA=$(sha256sum app-online-release.apk | awk '{print $1}')
          OFFLINE_SHA=$(sha256sum app-offline-release.apk | awk '{print $1}')
          ONLINE_SIZE=$(stat -c '%s' app-online-release.apk)
          OFFLINE_SIZE=$(stat -c '%s' app-offline-release.apk)
          cat > mobile-harness-update.json <<EOF
          {
            "versionCode": 7,
            "versionName": "1.0.6",
            "notes": "Production release with startup crash logging and verified runtime packaging.",
            "artifacts": {
              "online": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/v1.0.6/app-online-release.apk",
                "sha256": "$ONLINE_SHA",
                "sizeBytes": $ONLINE_SIZE
              },
              "offline": {
                "url": "https://github.com/sunmughan/Mobile-Harness-Extended/releases/download/v1.0.6/app-offline-release.apk",
                "sha256": "$OFFLINE_SHA",
                "sizeBytes": $OFFLINE_SIZE
              }
            }
          }
          EOF

      - name: Publish canonical v1.0.6 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release upload v1.0.6 app-online-release.apk app-offline-release.apk mobile-harness-update.json --clobber

# publish-current-release
